name: build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet test ServiceNowDesk.sln -c Release

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - run: dotnet build src/ServiceNowDesk.App/ServiceNowDesk.App.csproj -c Release
      - run: dotnet test tests/ServiceNowDesk.Core.Tests/ServiceNowDesk.Core.Tests.csproj -c Release
